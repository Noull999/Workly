<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En Mantenimiento - {{ streamer_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        .orbitron { font-family: 'Orbitron', sans-serif; }
        body {
            background: linear-gradient(135deg, #0a0a0a, #1a0a1a, #0a0a0a);
            min-height: 100vh;
        }
        .gradient-text {
            background: linear-gradient(135deg, #FF1493, #00FF7F);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .pulse-glow {
            animation: pulseGlow 2s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255,20,147,0.3); }
            50% { box-shadow: 0 0 40px rgba(255,20,147,0.6); }
        }
        .spin-slow {
            animation: spin 8s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="text-center max-w-2xl mx-auto">
        <div class="mb-8">
            <div class="w-32 h-32 mx-auto rounded-full bg-gradient-to-br from-pink-500 to-green-400 p-1 pulse-glow mb-6">
                <div class="w-full h-full rounded-full bg-gray-900 flex items-center justify-center">
                    <i class="fas fa-tools text-5xl text-pink-400 spin-slow"></i>
                </div>
            </div>
            
            <h1 class="text-4xl md:text-6xl font-bold orbitron gradient-text mb-4">
                EN MANTENIMIENTO
            </h1>
            
            <p class="text-xl md:text-2xl text-gray-300 mb-2">
                La página de <span class="text-pink-400 font-bold">{{ streamer_name }}</span> está temporalmente fuera de servicio
            </p>
            
            <p class="text-gray-500 text-lg">
                Estamos trabajando para mejorar tu experiencia. ¡Vuelve pronto!
            </p>
        </div>
        
        <div class="bg-gray-900/80 rounded-2xl p-6 border border-pink-500/30 mb-8">
            <div class="flex items-center justify-center gap-4 text-gray-400">
                <div class="flex items-center gap-2">
                    <i class="fab fa-twitch text-purple-400 text-2xl"></i>
                    <span>Sígueme en Kick</span>
                </div>
                <span class="text-gray-600">|</span>
                <a href="https://kick.com/yanglee" target="_blank" class="text-pink-400 hover:text-pink-300 font-bold transition-colors">
                    kick.com/yanglee
                </a>
            </div>
        </div>
        
        <div class="flex justify-center gap-6">
            <a href="https://kick.com/yanglee" target="_blank" class="w-14 h-14 rounded-full bg-green-500 flex items-center justify-center text-white hover:scale-110 transition-transform shadow-lg shadow-green-500/30">
                <i class="fas fa-play text-xl"></i>
            </a>
            <a href="https://twitter.com/yanglee" target="_blank" class="w-14 h-14 rounded-full bg-blue-500 flex items-center justify-center text-white hover:scale-110 transition-transform shadow-lg shadow-blue-500/30">
                <i class="fab fa-twitter text-xl"></i>
            </a>
            <a href="https://discord.gg/yanglee" target="_blank" class="w-14 h-14 rounded-full bg-indigo-500 flex items-center justify-center text-white hover:scale-110 transition-transform shadow-lg shadow-indigo-500/30">
                <i class="fab fa-discord text-xl"></i>
            </a>
        </div>
        
        <p class="text-gray-600 text-sm mt-8">
            <i class="fas fa-clock mr-1"></i>Volveremos lo antes posible
        </p>
    </div>
</body>
</html>
